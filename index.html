<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully suppress Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var filename = (e && e.filename) ? String(e.filename) : '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          filename.indexOf('@vite/client') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? (e.reason.message || e.reason.stack || String(e.reason)) : '';
        if (
          reason.indexOf('WebSocket') !== -1 ||
          reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          reason.indexOf('@vite/client') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>Next Chapter Dating</title>
    <meta name="description" content="An elegant and companion-focused dating app designed for mature singles entering their life's next beautiful chapter of connection and love." />
    <meta property="og:title" content="Next Chapter Dating" />
    <meta property="og:description" content="An elegant and companion-focused dating app designed for mature singles entering their life's next beautiful chapter of connection and love." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
